  <script>
    // 아이폰·아이패드: 탭 아이콘도 홈 화면과 같은 빨강 꽉 찬 // 로 (위 apple-touch-icon과 같은 그림)
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
      var touch = document.querySelector('link[rel="apple-touch-icon"]').href;
      document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { l.href = touch; l.type = "image/png"; l.setAttribute("sizes", "180x180"); });
    }
  </script>

  <!-- 상단 상태바 색: 스플래시 동안만 버건디, 그 뒤엔 화면 배경색과 같게 (app.js applyTheme) -->
  <meta name="theme-color" content="#DA2C23" />
  <meta name="color-scheme" content="light dark" />
  <!-- 화면 모드: 라이트 / 다크 / 기기 설정 (내 정보·로그인 화면에서 선택, 기본은 라이트) + 포인트 색 레드/블루/흑백. 그리기 전에 적용해서 깜빡임 없음 -->
  <script>
    (function () {
      var t = "light"; try { t = localStorage.getItem("lunchfound-theme") || "light"; } catch (e) {}
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      // 포인트 색: 레드(기본) / 블루 / 흑백 (내 정보에서 선택, 이 기기에 저장)
      var a = "red"; try { a = localStorage.getItem("lunchfound-accent") || "red"; } catch (e) {}
      if (a !== "blue" && a !== "mono") a = "red";
      document.documentElement.setAttribute("data-accent", a);
    })();
  </script>
